<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 236" width="1190" height="236" role="img" aria-label="Train in Isaac Lab at 4096 envs with PPO for 6000 iterations; export the checkpoint through the vendored play.py to policy.onnx and deploy.yaml; drive it in a headless scripted MuJoCo harness, which emits per-episode CSV that becomes curves and ladder charts, and MP4 that becomes paired GIFs.">
