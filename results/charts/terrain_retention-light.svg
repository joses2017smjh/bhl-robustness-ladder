<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img"><rect width="880" height="440" fill="#fcfcfb"/><text x="36" y="26" font-size="15.5" font-weight="600" fill="#0b0b0b" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Terrain transfer: what actually buys robustness to rough ground</text><text x="36" y="44" font-size="12.5" fill="#52514e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Sim2sim. Training and evaluation terrain come from different generators.</text><line x1="76" y1="356.5" x2="670" y2="356.5" stroke="#e6e5e1" stroke-width="1"/><text x="66" y="360.5" text-anchor="end" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.00</text><line x1="76" y1="287.8" x2="670" y2="287.8" stroke="#e6e5e1" stroke-width="1"/><text x="66" y="291.8" text-anchor="end" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.25</text><line x1="76" y1="219.0" x2="670" y2="219.0" stroke="#e6e5e1" stroke-width="1"/><text x="66" y="223.0" text-anchor="end" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.50</text><line x1="76" y1="150.2" x2="670" y2="150.2" stroke="#e6e5e1" stroke-width="1"/><text x="66" y="154.2" text-anchor="end" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0.75</text><line x1="76" y1="81.5" x2="670" y2="81.5" stroke="#e6e5e1" stroke-width="1"/><text x="66" y="85.5" text-anchor="end" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">1.00</text><text x="92.8" y="382" text-anchor="middle" font-size="12" fill="#8a8880" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">0</text