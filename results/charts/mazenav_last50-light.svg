  <text x="36" y="44" font-size="12.5" fill="#52514e" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Timeout fraction vs button-reached termination. Each tick is a seed. Sensors do not separate.</text>
